services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: helios-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    networks:
      - helios-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_API_URL: http://backend:8000
    container_name: helios-frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - helios-network

networks:
  helios-network:
    driver: bridge
